<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>About – Janis Oldani</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400;1,6..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="navbar-name" id="navbar-name">
        <div class="navbar-profile-image">
          <img id="navbar-profile-photo" alt="Profile" />
        </div>
      </a>

      <nav class="navbar-nav">
        <a href="work.html" class="navbar-link">Work</a>
        <a href="experience.html" class="navbar-link">Experience</a>
        <a href="about.html" class="navbar-link navbar-link-active">About</a>
        <a href="contact.html" class="navbar-link">Contact</a>
      </nav>

      <a class="navbar-social" id="navbar-linkedin" href="#" target="_blank">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M4.5 2a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM3 7h3v10H3V7zm6 0h3v1.2c.6-.9 1.8-1.4 3.2-1.4 3.3 0 4 2.1 4 5v5.2h-3v-4.6c0-1.2 0-2.7-1.7-2.7-1.7 0-2 1.3-2 2.6v4.7h-3V7z"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <!-- Who I Am -->
    <section id="about">
      <div class="section-badge" id="about-badge"></div>
      <h1 class="section-hero-title" id="about-hero-title"></h1>
      <p class="section-hero-subtitle" id="about-hero-subtitle"></p>

      <div class="about-split">
        <div class="about-text" id="about-text"></div>
        <div class="quick-facts" id="quick-facts">
          <div class="quick-facts-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <div>
              <strong>Quick Facts</strong>
              <span>At a glance</span>
            </div>
          </div>
          <div class="quick-facts-list" id="quick-facts-list"></div>
        </div>
      </div>
    </section>

    <!-- Tab Switch -->
    <div class="about-tabs">
      <button class="about-tab is-active" data-tab="professional">Professional</button>
      <button class="about-tab" data-tab="personal">Personal</button>
    </div>

    <!-- Professional Panel -->
    <div class="about-panel is-active" id="panel-professional">
      <section id="traits">
        <div class="grid" id="traits-container"></div>
      </section>

      <section id="skills">
        <div class="section-badge">Technical Expertise</div>
        <h2 class="section-hero-title section-hero-title--sm">Skills & Tools</h2>
        <p class="section-hero-subtitle">Technologies and tools I work with.</p>
        <div class="grid" id="skills-container"></div>
      </section>
    </div>

    <!-- Personal Panel -->
    <div class="about-panel" id="panel-personal">
      <section id="sport">
        <div class="section-badge" id="sport-badge"></div>
        <h2 class="section-hero-title section-hero-title--sm" id="sport-title"></h2>
        <p class="section-hero-subtitle" id="sport-subtitle"></p>

        <div class="sport-split">
          <div class="sport-text-block">
            <p class="sport-text" id="sport-text"></p>
            <div class="sport-tags" id="sport-tags"></div>
          </div>
          <div class="sport-stats" id="sport-stats"></div>
        </div>
      </section>

      <section id="beyond-code">
        <div class="section-badge" id="beyond-badge"></div>
        <h2 class="section-hero-title section-hero-title--sm" id="beyond-title"></h2>
        <p class="section-hero-subtitle" id="beyond-subtitle"></p>

        <!-- Hero image (cinematic strip) -->
        <div class="beyond-hero" id="beyond-hero"></div>

        <!-- Photo mosaic -->
        <div class="beyond-mosaic" id="beyond-gallery"></div>

        <!-- Ironman statement -->
        <div class="beyond-ironman" id="beyond-ironman"></div>

        <!-- Skills transfer tags -->
        <div class="beyond-transfer">
          <p class="beyond-transfer-label">What these experiences bring to my work:</p>
          <div class="beyond-transfer-tags" id="beyond-transfer-tags"></div>
        </div>
      </section>
    </div>

    <!-- Testimonials -->
    <section id="testimonials">
      <div class="section-badge">References</div>
      <h2 class="section-hero-title section-hero-title--sm">Testimonials</h2>
      <p class="section-hero-subtitle">What others say about working with me.</p>
      <div class="testimonials-grid" id="testimonials-container"></div>
    </section>

    <!-- CV Download -->
    <section class="cv-section">
      <a id="cv-download-btn" class="btn-cv" href="#" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Resume (PDF)
      </a>
    </section>

    <footer>
      &copy; <span id="year"></span>
      <span id="footer-owner-name"></span>.
      <span id="footer-built-with"></span>
    </footer>
  </main>

  <script src="js/content.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/page-about.js"></script>
</body>

</html>
