<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Contact – Janis Oldani</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400;1,6..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="navbar-name" id="navbar-name">
        <div class="navbar-profile-image">
          <img id="navbar-profile-photo" alt="Profile" />
        </div>
      </a>

      <nav class="navbar-nav">
        <a href="work.html" class="navbar-link">Work</a>
        <a href="experience.html" class="navbar-link">Experience</a>
        <a href="about.html" class="navbar-link">About</a>
        <a href="contact.html" class="navbar-link navbar-link-active">Contact</a>
      </nav>

      <a class="navbar-social" id="navbar-linkedin" href="#" target="_blank">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M4.5 2a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM3 7h3v10H3V7zm6 0h3v1.2c.6-.9 1.8-1.4 3.2-1.4 3.3 0 4 2.1 4 5v5.2h-3v-4.6c0-1.2 0-2.7-1.7-2.7-1.7 0-2 1.3-2 2.6v4.7h-3V7z"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section id="contact">
      <div class="section-badge">Contact</div>
      <h1 class="section-hero-title" id="contact-title"></h1>
      <p class="section-hero-subtitle" id="contact-subtitle"></p>

      <div class="contact-box">
        <div>
          <p id="contact-intro"></p>
          <p class="contact-highlight" style="margin-top: 6px;">
            <span id="contact-email-label-prefix"></span>
            <a id="contact-email-link"></a>
          </p>
        </div>

        <div class="contact-actions">
          <button id="contact-email-link-btn" class="btn btn-primary"></button>
          <a class="btn btn-secondary" id="link-linkedin" href="#" target="_blank">LinkedIn</a>
          <a class="btn btn-secondary" id="link-github" href="#" target="_blank">GitHub</a>
        </div>
      </div>
    </section>

    <footer>
      © <span id="year"></span>
      <span id="footer-owner-name"></span>.
      <span id="footer-built-with"></span>
    </footer>
  </main>

  <script src="js/content.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/page-contact.js"></script>
</body>

</html>
