<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <title>Janis Oldani – Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="navbar-name" id="navbar-name">
        <div class="navbar-profile-image">
          <img id="navbar-profile-photo" alt="Profilbild" />
        </div>
      </a>

      <nav class="navbar-nav">
        <a href="work.html" class="navbar-link">Work & Projekte</a>
        <a href="experience.html" class="navbar-link">Erfahrung</a>
        <a href="about.html" class="navbar-link">Profil & Background</a>
        <a href="contact.html" class="navbar-link">Kontakt</a>
      </nav>

      <a class="navbar-social" id="navbar-linkedin" href="#" target="_blank">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M4.5 2a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM3 7h3v10H3V7zm6 0h3v1.2c.6-.9 1.8-1.4 3.2-1.4 3.3 0 4 2.1 4 5v5.2h-3v-4.6c0-1.2 0-2.7-1.7-2.7-1.7 0-2 1.3-2 2.6v4.7h-3V7z"/>
        </svg>
      </a>
    </div>
  </header>

  <main>

    <!-- HERO -->
    <header class="hero" id="top">
      <div class="hero-left">
        <h1 class="hero-title">
          <span id="hero-title-line1"></span><br />
          <span id="hero-title-line2"></span>
        </h1>

        <p class="hero-subtitle" id="hero-subtitle"></p>

        <div class="hero-buttons">
          <a href="work.html" class="btn btn-primary" id="hero-primary-cta"></a>
          <a href="experience.html" class="btn btn-secondary" id="hero-tertiary-cta"></a>
          <a href="contact.html" class="btn btn-secondary" id="hero-secondary-cta"></a>
        </div>

        <div class="hero-meta">
          <div class="hero-meta-item">
            <span class="hero-meta-label">Fokus</span>
            <span class="hero-meta-value">AI, Data, Web</span>
          </div>
          <div class="hero-meta-item">
            <span class="hero-meta-label">Standort</span>
            <span class="hero-meta-value" id="hero-location"></span>
          </div>
          <div class="hero-meta-item">
            <span class="hero-meta-label">Status</span>
            <span class="hero-meta-value" id="hero-role"></span>
          </div>
        </div>

        <aside class="hero-card" aria-label="Kurzprofil">
          <div class="hero-card-inner">
            <div class="hero-card-top">
              <span class="hero-tag">Über mich</span>
              <span class="status-pill">
                <span class="status-dot"></span>
                <span id="availability-status-text"></span>
              </span>
            </div>

            <div class="hero-card-header">
              <div class="profile-avatar">
                <img id="profile-photo" alt="Profilbild" />
              </div>
              <div class="hero-card-header-content">
                <h2 class="hero-name" id="hero-name"></h2>
                <p class="hero-card-text" id="hero-about"></p>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </header>

    <!-- SKILLS -->
    <section class="skills-section">
      <div class="section-header">
        <div>
          <h3 class="section-title">Skills</h3>
        </div>
      </div>
      <div class="skills-tags" id="skills-tags"></div>
    </section>

    <!-- CTA -->
    <section class="cta-block">
      <div class="cta-block-inner">
        <p>Lass uns zusammenarbeiten – ich freue mich auf deine Nachricht.</p>
        <a id="cta-email-btn" class="btn btn-primary" href="#">Kontakt aufnehmen</a>
      </div>
    </section>

    <footer>
      © <span id="year"></span>
      <span id="footer-owner-name"></span>.
      <span id="footer-built-with"></span>
    </footer>
  </main>

  <script src="js/content.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
